<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0B0F19"/>
  <rect x="30" y="30" width="740" height="390" rx="14" fill="#111827" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="740" height="60" rx="14" fill="#0E1626"/>
  <text x="60" y="66" fill="#C084FC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">📚 Sistema de Biblioteca Digital &amp; Control de Préstamos</text>
  
  <!-- Search Bar -->
  <rect x="60" y="110" width="450" height="38" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
  <text x="80" y="134" fill="#64748B" font-family="system-ui" font-size="12">🔍 Buscar por título, autor, ISBN o categoría...</text>
  
  <!-- Book Grid -->
  <g transform="translate(60, 170)">
    <!-- Book 1 -->
    <rect x="0" y="0" width="150" height="220" rx="8" fill="#182234" stroke="rgba(255,255,255,0.08)"/>
    <rect x="15" y="15" width="120" height="110" rx="4" fill="#312E81"/>
    <text x="75" y="70" fill="#A5B4FC" font-family="monospace" font-size="10" text-anchor="middle">ING. SOFTWARE</text>
    <text x="15" y="145" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="bold">Clean Code</text>
    <text x="15" y="162" fill="#94A3B8" font-family="system-ui" font-size="9">Robert C. Martin</text>
    <rect x="15" y="180" width="80" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="55" y="193" fill="#34D399" font-family="system-ui" font-size="8" text-anchor="middle">DISPONIBLE (4)</text>
    
    <!-- Book 2 -->
    <rect x="175" y="0" width="150" height="220" rx="8" fill="#182234" stroke="rgba(255,255,255,0.08)"/>
    <rect x="190" y="15" width="120" height="110" rx="4" fill="#1E3A8A"/>
    <text x="250" y="70" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">BASE DE DATOS</text>
    <text x="190" y="145" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="bold">Fundamentos BD</text>
    <text x="190" y="162" fill="#94A3B8" font-family="system-ui" font-size="9">Silberschatz / Korth</text>
    <rect x="190" y="180" width="80" height="18" rx="4" fill="rgba(239,68,68,0.2)"/>
    <text x="230" y="193" fill="#F87171" font-family="system-ui" font-size="8" text-anchor="middle">PRESTADO</text>
    
    <!-- Book 3 -->
    <rect x="350" y="0" width="150" height="220" rx="8" fill="#182234" stroke="rgba(255,255,255,0.08)"/>
    <rect x="365" y="15" width="120" height="110" rx="4" fill="#4C1D95"/>
    <text x="425" y="70" fill="#E9D5FF" font-family="monospace" font-size="10" text-anchor="middle">ALGORITMOS</text>
    <text x="365" y="145" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="bold">Estructuras Datos</text>
    <text x="365" y="162" fill="#94A3B8" font-family="system-ui" font-size="9">Cormen / Leiserson</text>
    <rect x="365" y="180" width="80" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="405" y="193" fill="#34D399" font-family="system-ui" font-size="8" text-anchor="middle">DISPONIBLE (2)</text>
    
    <!-- Loans Sidebar Mockup -->
    <rect x="525" y="0" width="155" height="220" rx="8" fill="#131B2A" stroke="rgba(255,255,255,0.05)"/>
    <text x="540" y="30" fill="#CBD5E1" font-family="system-ui" font-size="11" font-weight="bold">Préstamos Activos</text>
    <text x="540" y="55" fill="#94A3B8" font-family="system-ui" font-size="9">• Matrícula: 2024-91</text>
    <text x="540" y="70" fill="#64748B" font-family="system-ui" font-size="8">Devolución: 28/08</text>
    <text x="540" y="100" fill="#94A3B8" font-family="system-ui" font-size="9">• Matrícula: 2023-44</text>
    <text x="540" y="115" fill="#F87171" font-family="system-ui" font-size="8">MORA: +2 días</text>
  </g>
</svg>