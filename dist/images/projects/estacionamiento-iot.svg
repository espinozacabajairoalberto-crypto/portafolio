    <text x="490" y="60" fill="#94A3B8" font-family="system-ui" font-size="11">Sensor: HC-SR04 #3</text>
    <text x="490" y="90" fill="#34D399" font-family="system-ui" font-size="13" font-weight="bold">🟢 DISPONIBLE</text>

    <!-- Row 2 -->
    <!-- Spot B1 (Occupied) -->
    <rect x="0" y="130" width="210" height="110" rx="8" fill="#24141E" stroke="#EF4444" stroke-width="2"/>
    <text x="20" y="160" fill="#EF4444" font-family="monospace" font-size="14" font-weight="bold">PLAZA B-01</text>
    <text x="20" y="190" fill="#94A3B8" font-family="system-ui" font-size="11">Distancia: 18 cm</text>
    <text x="20" y="220" fill="#F87171" font-family="system-ui" font-size="13" font-weight="bold">🔴 OCUPADO</text>

    <!-- Spot B2 (Free) -->
    <rect x="235" y="130" width="210" height="110" rx="8" fill="#132034" stroke="#10B981" stroke-width="2"/>
    <text x="255" y="160" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">PLAZA B-02</text>
    <text x="255" y="190" fill="#94A3B8" font-family="system-ui" font-size="11">Sensor: HC-SR04 #5</text>
    <text x="255" y="220" fill="#34D399" font-family="system-ui" font-size="13" font-weight="bold">🟢 DISPONIBLE</text>

    <!-- Spot B3 (Free) -->
    <rect x="470" y="130" width="210" height="110" rx="8" fill="#132034" stroke="#10B981" stroke-width="2"/>
    <text x="490" y="160" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">PLAZA B-03</text>
    <text x="490" y="190" fill="#94A3B8" font-family="system-ui" font-size="11">Sensor: HC-SR04 #6</text>
    <text x="490" y="220" fill="#34D399" font-family="system-ui" font-size="13" font-weight="bold">🟢 DISPONIBLE</text>
