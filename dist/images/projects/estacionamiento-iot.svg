    <text x="255" y="60" fill="#94A3B8" font-family="system-ui" font-size="11">Distancia: 14 cm</text>
    <text x="255" y="90" fill="#F87171" font-family="system-ui" font-size="13" font-weight="bold">🔴 OCUPADO</text>

    <!-- Spot A3 (Free) -->
