<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0B0F19"/>
  <rect x="30" y="30" width="740" height="390" rx="14" fill="#0F172A" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
  
  <text x="60" y="70" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">📡 Sistema IoT de Estacionamiento Inteligente</text>
  <text x="60" y="92" fill="#94A3B8" font-family="system-ui" font-size="12">Monitoreo en Tiempo Real con Sensores Ultrasónicos y Arduino</text>
  
  <!-- Live Counter Widget -->
  <rect x="560" y="50" width="180" height="50" rx="8" fill="#1E293B" stroke="rgba(56,189,248,0.3)"/>
  <circle cx="580" cy="75" r="6" fill="#10B981"/>
  <text x="595" y="72" fill="#94A3B8" font-family="system-ui" font-size="10">Disponibilidad:</text>
  <text x="595" y="88" fill="#34D399" font-family="system-ui" font-size="14" font-weight="bold">4 / 6 Plazas Libres</text>
  
  <!-- Parking Layout Simulation -->
  <g transform="translate(60, 130)">
    <!-- Row 1 -->
    <!-- Spot A1 (Free) -->
    <rect x="0" y="0" width="210" height="110" rx="8" fill="#132034" stroke="#10B981" stroke-width="2"/>
