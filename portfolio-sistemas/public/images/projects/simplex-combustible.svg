<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0B0F19"/>
  <rect x="30" y="30" width="740" height="390" rx="14" fill="#111827" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  
  <text x="60" y="70" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">📈 Optimización de Distribución de Combustible</text>
  <text x="60" y="92" fill="#94A3B8" font-family="system-ui" font-size="12">Modelo Matemático de Programación Lineal y Método Simplex</text>
  
  <!-- Formula Card -->
  <rect x="60" y="120" width="310" height="110" rx="8" fill="#162234" stroke="rgba(255,255,255,0.06)"/>
  <text x="75" y="145" fill="#A5B4FC" font-family="monospace" font-size="12" font-weight="bold">Función Objetivo (Minimizar):</text>
  <text x="75" y="175" fill="#F8FAFC" font-family="monospace" font-size="13">Z = Σ (Cij * Xij)</text>
  <text x="75" y="205" fill="#64748B" font-family="system-ui" font-size="11">Sujeto a: Oferta planta i, Demanda estación j</text>
  
  <!-- Metrics Result Card -->
  <rect x="390" y="120" width="350" height="110" rx="8" fill="#162E25" stroke="rgba(16,185,129,0.2)"/>
  <text x="410" y="145" fill="#6EE7B7" font-family="system-ui" font-size="12" font-weight="bold">Resultado de la Optimización:</text>
  <text x="410" y="180" fill="#34D399" font-family="system-ui" font-size="22" font-weight="bold">-18.4% Costo Logístico Total</text>
  <text x="410" y="205" fill="#A7F3D0" font-family="system-ui" font-size="11">Convergencia alcanzada en 4 iteraciones Simplex</text>
  
  <!-- Matrix / Graph Visual -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="680" height="145" rx="8" fill="#0D1320" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="25" fill="#94A3B8" font-family="monospace" font-size="11">MATRIZ DE ASIGNACIÓN ÓPTIMA (Galones / Ruta):</text>
    
    <text x="20" y="55" fill="#CBD5E1" font-family="monospace" font-size="11">Refinería Norte → Estación Central:  15,000 Gal  ($ 0.42 / km)</text>
    <text x="20" y="80" fill="#CBD5E1" font-family="monospace" font-size="11">Refinería Norte → Estación Este:      8,500 Gal  ($ 0.55 / km)</text>
    <text x="20" y="105" fill="#CBD5E1" font-family="monospace" font-size="11">Refinería Sur   → Estación Oeste:    12,000 Gal  ($ 0.38 / km)</text>
    <text x="20" y="130" fill="#CBD5E1" font-family="monospace" font-size="11">Refinería Sur   → Estación Sur:      20,000 Gal  ($ 0.31 / km)</text>
  </g>
</svg>