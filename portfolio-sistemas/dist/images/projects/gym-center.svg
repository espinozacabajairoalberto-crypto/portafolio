    <text x="325" y="160" fill="#94A3B8" font-family="monospace" font-size="9">• sp_validar_acceso()</text>
    <text x="325" y="178" fill="#94A3B8" font-family="monospace" font-size="9">• sp_registrar_pago()</text>
