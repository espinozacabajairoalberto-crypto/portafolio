    <rect x="300" y="0" width="220" height="30" rx="8" fill="#182234"/>
    <text x="315" y="20" fill="#FFD700" font-family="system-ui" font-size="11" font-weight="bold">🎵 Reproductor Gimnasio</text>
    
    <rect x="315" y="45" width="190" height="60" rx="6" fill="#1C2638"/>
    <circle cx="340" cy="75" r="16" fill="#FFD700"/>
    <polygon points="336,68 348,75 336,82" fill="#000000"/>
    <text x="365" y="68" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold">Playlist Energía</text>
    <text x="365" y="85" fill="#94A3B8" font-family="system-ui" font-size="9">Electro Workout 2026</text>
    
    <rect x="315" y="120" width="190" height="75" rx="6" fill="#182030" stroke="rgba(255,215,0,0.2)"/>
