    <rect x="210" y="40" width="55" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="237" y="52" fill="#34D399" font-family="monospace" font-size="8" text-anchor="middle">PERMITIDO</text>
    
    <text x="15" y="82" fill="#E2E8F0" font-family="monospace" font-size="10">08:29 - Valeria Gómez</text>
    <rect x="210" y="70" width="55" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="237" y="82" fill="#34D399" font-family="monospace" font-size="8" text-anchor="middle">PERMITIDO</text>
    
    <text x="15" y="112" fill="#E2E8F0" font-family="monospace" font-size="10">08:14 - Fernando Rios</text>
    <rect x="210" y="100" width="55" height="16" rx="4" fill="rgba(239,68,68,0.2)"/>
    <text x="237" y="112" fill="#F87171" font-family="monospace" font-size="8" text-anchor="middle">VENCIDO</text>
    
    <text x="15" y="142" fill="#E2E8F0" font-family="monospace" font-size="10">08:02 - Andrés Vaca</text>
    <rect x="210" y="130" width="55" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="237" y="142" fill="#34D399" font-family="monospace" font-size="8" text-anchor="middle">PERMITIDO</text>
    
    <!-- Music Player Sub-panel -->
